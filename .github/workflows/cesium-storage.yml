name: Verify Cesium Storage Integration

on:
  push:
    branches: ["main", "feature/cesium-folia-storage-clean"]
  pull_request:
    paths:
      - ".github/workflows/cesium-storage.yml"
      - "cesium-folia/**"
      - "canvas-server/build.gradle.kts.patch"
      - "canvas-server/minecraft-patches/sources/**"
      - "canvas-server/src/main/java/io/canvasmc/canvas/GlobalConfiguration.java"
      - "canvas-server/src/main/java/io/canvasmc/canvas/storage/**"
      - "canvas-server/src/main/java/io/canvasmc/canvas/subcommands/CesiumStatusSubCommand.java"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: "-Xmx4G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply all patches
        run: ./gradlew applyAllPatches --stacktrace --no-configuration-cache --info --warning-mode all

      - name: Build paperclip jar
        run: ./gradlew :canvas-server:createPaperclipJar --stacktrace --no-configuration-cache --info --warning-mode all

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-cesium-paperclip
          path: canvas-server/build/libs/canvas-paperclip-*.jar
          if-no-files-found: error
