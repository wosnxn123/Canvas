name: Freeze Folesium source patches

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Xmx4G"
      FOLESIUM_REF: bbc3f40064bff683b38e071b04541cada9a8ab96
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Generate fork sources
        run: ./gradlew applyAllPatches --no-configuration-cache

      - name: Apply Folesium integration
        run: ./folesium-integration/setup-folesium.sh --no-build

      - name: Rebuild persistent source patches
        run: ./rbp.sh --force --gradle

      - name: Validate generated patch set
        run: git diff --check
      - name: Commit and remove one-time workflow
        run: |
          git add canvas-server/paper-patches canvas-server/minecraft-patches
          git diff --cached --quiet && exit 1
          git rm .github/workflows/freeze-folesium-patches.yml
          git commit -m "feat(folesium): embed storage integration patches"

      - name: Reapply persistent source patches
        run: |
          rm -rf paper-server canvas-server/src/minecraft
          ./gradlew applyAllPatches --no-configuration-cache

      - name: Build embedded integration
        run: ./gradlew :canvas-server:createPaperclipJar --no-configuration-cache

      - name: Upload embedded paperclip
        uses: actions/upload-artifact@v4
        with:
          name: canvas-folesium-paperclip
          path: canvas-server/build/libs/canvas-paperclip-*.jar

      - name: Push persistent source patches
        run: git push origin HEAD:main
